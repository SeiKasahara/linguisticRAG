services:
  db:
    container_name: linguisticRAG-db
    image: postgres
    restart: unless-stopped
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready",
             "-U", postgres,
      ]
      interval: 5s
      timeout: 10s
      retries: 5
    env_file: ./server/.env
    ports:
      - 5432:5432
  server:
    container_name: linguisticRAG-server
    environment:
      POSTGRES_HOST:     linguisticRAG-db
      POSTGRES_PORT:     5432
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 114514
      POSTGRES_DB:       linguistics_db
    build:
      context: .
      dockerfile: ./docker/server/Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - 8000:8000
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/server:/app
  client:
    container_name: linguisticRAG-client
    build:
      context: .
      dockerfile: ./docker/client/Dockerfile
    restart: unless-stopped
    env_file: ./client/.env
    ports:
      - 3000:3000
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/client:/app
      - ignore:/app/node_modules

volumes:
  ignore:
